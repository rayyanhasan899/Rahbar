name: CD
'on':
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: cd-main
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build-push:
    runs-on: ubuntu-24.04
    needs:
    - test
    strategy:
      matrix:
        component:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ${{ matrix.component }}
        push: true
        build-args: VCS_REF=${{ github.sha }}
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.component }}:${{ github.sha }}
  deploy:
    runs-on: ubuntu-24.04
    needs:
    - build-push
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: rahbar-release
        config: scripts/kind-ci.yaml
    - run: 'kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml

        kubectl -n kube-system rollout status daemonset/calico-node --timeout=240s'
    - name: Pull published main SHA images and load kind
      env:
        REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
      run: "for component in api indexer ui; do\n  image=\"$REGISTRY/rahbar-$component:${{ github.sha }}\"\n  docker pull\
        \ \"$image\"\n  kind load docker-image \"$image\" --name rahbar-release\ndone"
    - name: Index, roll out and smoke-test published SHA through Ingress
      env:
        REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: bash scripts/e2e_cluster.sh
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: release-evidence-${{ github.sha }}
        path: '.venv/acceptance/fixture-results.json

          .venv/acceptance/deployed-images.json

          .venv/acceptance/indexer.log

          .venv/stack.json'
