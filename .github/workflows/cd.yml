name: CD
'on':
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: cd-main
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  build-push:
    runs-on: ubuntu-24.04
    needs:
    - test
    strategy:
      matrix:
        component:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: ${{ matrix.component }}
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-${{ matrix.component }}:${{ github.sha }}
  deploy:
    runs-on: ubuntu-24.04
    needs:
    - build-push
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r api/requirements.txt -r indexer/requirements.txt
    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - uses: helm/kind-action@v1.12.0
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: rahbar-release
        config: scripts/kind-ci.yaml
    - run: 'kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml

        kubectl -n kube-system rollout status daemonset/calico-node --timeout=240s'
    - name: Pull published main SHA images and load kind
      env:
        REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
      run: "for component in api indexer ui; do\n  image=\"$REGISTRY/rahbar-$component:${{ github.sha }}\"\n  docker pull\
        \ \"$image\"\n  kind load docker-image \"$image\" --name rahbar-release\ndone"
    - name: Index, roll out and smoke-test published SHA through Ingress
      env:
        REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
      run: bash scripts/e2e_cluster.sh
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: release-evidence-${{ github.sha }}
        path: '/tmp/fixture-results.json

          /tmp/deployed-images.json

          /tmp/indexer.log

          /tmp/stack.json'
