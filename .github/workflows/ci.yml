name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - run: ruff check api indexer eval corpus
    - run: cd api && mypy app
    - run: cd indexer && mypy pipeline
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
    - run: cd api && pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
    - run: cd indexer && pytest -q
    - run: pytest -q eval/tests
  manifests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - run: bash scripts/install_kubeconform.sh
    - run: kubectl kustomize k8s/overlays/prod | .venv/tools/kubeconform -strict -summary -kubernetes-version 1.34.0
  build:
    runs-on: ubuntu-24.04
    needs:
    - lint
    - test
    - manifests
    strategy:
      matrix:
        component:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@v4
    - run: docker build -t rahbar-${{ matrix.component }}:${{ github.sha }} ${{ matrix.component }}
    - run: docker save rahbar-${{ matrix.component }}:${{ github.sha }} | gzip > /tmp/${{ matrix.component }}.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: image-${{ matrix.component }}
        path: /tmp/${{ matrix.component }}.tar.gz
        retention-days: 1
  e2e-eval:
    runs-on: ubuntu-24.04
    needs:
    - build
    - scan
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -r api/requirements.txt -r indexer/requirements.txt
    - uses: helm/kind-action@v1.12.0
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: rahbar-ci
        config: scripts/kind-ci.yaml
    - run: 'kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml

        kubectl -n kube-system rollout status daemonset/calico-node --timeout=240s'
    - uses: actions/download-artifact@v4
      with:
        pattern: image-*
        path: /tmp/images
        merge-multiple: true
    - run: "for component in api indexer ui; do\n  gunzip -c /tmp/images/$component.tar.gz | docker load\n  kind load docker-image\
        \ rahbar-$component:${{ github.sha }} --name rahbar-ci\ndone"
    - run: bash scripts/e2e_cluster.sh
      env:
        IMAGE_TAG: ${{ github.sha }}
    - if: always()
      run: kubectl get pods,jobs,pvc -n rahbar; kubectl get events -n rahbar --sort-by=.lastTimestamp; kubectl -n rahbar logs
        deployment/api --tail=30 || true; kubectl -n rahbar logs job/indexer --tail=30 || true
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fixture-eval
        path: '/tmp/fixture-results.json

          /tmp/indexer.log

          /tmp/deployed-images.json

          /tmp/stack.json'
  scan:
    runs-on: ubuntu-24.04
    needs:
    - build
    strategy:
      matrix:
        component:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: image-${{ matrix.component }}
        path: /tmp/images
    - run: gunzip -c /tmp/images/${{ matrix.component }}.tar.gz | docker load
    - name: Fail on fixable HIGH or CRITICAL
      run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 rahbar-${{ matrix.component }}:${{ github.sha
        }}
  quality:
    runs-on: ubuntu-24.04
    if: always()
    needs:
    - lint
    - test
    - manifests
    - build
    - scan
    - e2e-eval
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
      run: 'python - <<''PY''

        import json,os

        jobs=json.loads(os.environ[''RESULTS''])

        assert all(j[''result'']==''success'' for j in jobs.values()), jobs

        PY'
'on':
  push:
    branches:
    - dev
  pull_request:
    branches:
    - main
    - dev
  workflow_call: {}
