name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[real-audit]') || inputs.real_audit) && github.sha
    || 'ordinary' }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
        cache: pip
    - run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
    - run: ruff check api indexer eval corpus scripts
    - run: cd api && mypy app
    - run: cd indexer && mypy pipeline
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
        cache: pip
    - run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
    - run: cd api && pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
    - run: cd indexer && pytest -q
    - run: pytest -q eval/tests
  manifests:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - run: bash scripts/install_kubeconform.sh
    - run: kubectl kustomize k8s/overlays/prod | .venv/tools/kubeconform -strict -summary -kubernetes-version 1.34.0
  build:
    runs-on: ubuntu-24.04
    needs:
    - lint
    - test
    - manifests
    strategy:
      matrix:
        component:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - run: docker build --build-arg VCS_REF=${{ github.sha }} -t rahbar-${{ matrix.component }}:${{ github.sha }} ${{ matrix.component }}
    - run: docker save rahbar-${{ matrix.component }}:${{ github.sha }} | gzip > /tmp/${{ matrix.component }}.tar.gz
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: image-${{ matrix.component }}
        path: /tmp/${{ matrix.component }}.tar.gz
        retention-days: 1
  e2e-eval:
    runs-on: ubuntu-24.04
    needs:
    - build
    - scan
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock'
    - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: rahbar-ci
        config: scripts/kind-ci.yaml
    - run: 'kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml

        kubectl -n kube-system rollout status daemonset/calico-node --timeout=240s'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: image-*
        path: /tmp/images
        merge-multiple: true
    - run: "for component in api indexer ui; do\n  gunzip -c /tmp/images/$component.tar.gz | docker load\n  kind load docker-image\
        \ rahbar-$component:${{ github.sha }} --name rahbar-ci\ndone"
    - run: bash scripts/e2e_cluster.sh
      env:
        IMAGE_TAG: ${{ github.sha }}
    - if: always()
      run: kubectl get pods,jobs,pvc -n rahbar; kubectl get events -n rahbar --sort-by=.lastTimestamp; kubectl -n rahbar logs
        deployment/api --tail=30 || true; kubectl -n rahbar logs job/indexer --tail=30 || true
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fixture-eval
        path: '.venv/acceptance/fixture-results.json

          .venv/acceptance/indexer.log

          .venv/acceptance/deployed-images.json

          .venv/stack.json'
  scan:
    runs-on: ubuntu-24.04
    needs:
    - build
    strategy:
      matrix:
        component:
        - api
        - indexer
        - ui
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: image-${{ matrix.component }}
        path: /tmp/images
    - run: gunzip -c /tmp/images/${{ matrix.component }}.tar.gz | docker load
    - name: Fail on fixable HIGH or CRITICAL
      run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
        image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 rahbar-${{ matrix.component }}:${{ github.sha
        }}
  quality:
    runs-on: ubuntu-24.04
    if: always()
    needs:
    - lint
    - test
    - manifests
    - build
    - scan
    - e2e-eval
    steps:
    - env:
        RESULTS: ${{ toJSON(needs) }}
      run: 'python - <<''PY''

        import json,os

        jobs=json.loads(os.environ[''RESULTS''])

        assert all(j[''result'']==''success'' for j in jobs.values()), jobs

        PY'
  real-audit:
    if: contains(github.event.head_commit.message, '[real-audit]') || (github.event_name == 'workflow_dispatch' && inputs.real_audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
    - build
    - scan
    - e2e-eval
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - run: 'sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

        pip install --require-hashes --only-binary=:all: -r requirements-audit.lock'
    - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
      with:
        version: v0.30.0
        node_image: kindest/node:v1.34.0
        cluster_name: rahbar-real
        config: scripts/kind-ci.yaml
    - run: 'kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.30.3/manifests/calico.yaml

        kubectl -n kube-system rollout status daemonset/calico-node --timeout=240s

        kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.0/components.yaml

        kubectl -n kube-system patch deployment metrics-server --type=json -p=''[ {"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}
        ]''

        kubectl -n kube-system rollout status deployment/metrics-server --timeout=240s'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: image-*
        path: /tmp/images
        merge-multiple: true
    - run: "for component in api indexer ui; do\n gunzip -c /tmp/images/$component.tar.gz | docker load\n kind load docker-image\
        \ rahbar-$component:${{ github.sha }} --name rahbar-real\ndone"
    - run: bash scripts/e2e_cluster.sh
      env:
        IMAGE_TAG: ${{ github.sha }}
        CORPUS_MODE: real
        CLUSTER_NAME: rahbar-real
    - if: always()
      run: kubectl -n rahbar get pods,jobs,pvc,hpa; kubectl -n rahbar get events --sort-by=.lastTimestamp; kubectl -n rahbar
        logs deployment/api --tail=40 || true; kubectl -n rahbar logs job/indexer --tail=40 || true
    - if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: real-audit-${{ github.sha }}
        path: '.venv/acceptance/

          .venv/acceptance/indexer-top.log

          .venv/acceptance/indexer.log

          .venv/stack.json

          .venv/acceptance/corpus-pinned-manifest.md'
'on':
  push:
    branches:
    - dev
  pull_request:
    branches:
    - main
    - dev
  workflow_call: {}
  workflow_dispatch:
    inputs:
      real_audit:
        description: Run slow real-corpus acceptance experiments
        type: boolean
        default: false
