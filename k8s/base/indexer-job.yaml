apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: indexer
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: indexer
        image: rahbar-indexer:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: indexer-lock
          mountPath: /locks
        - name: corpus
          mountPath: /corpus
          readOnly: true
        args: []
        command:
        - python
        - -m
        - pipeline.run
        envFrom:
        - configMapRef:
            name: rahbar-config
      volumes:
      - name: tmp
        emptyDir: {}
      - name: indexer-lock
        persistentVolumeClaim:
          claimName: indexer-lock
      - name: corpus
        persistentVolumeClaim:
          claimName: corpus-data
      restartPolicy: OnFailure
      initContainers:
      - name: wait-chroma
        image: rahbar-indexer:dev
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - pipeline.wait
        envFrom:
        - configMapRef:
            name: rahbar-config
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
