apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      serviceAccountName: redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4.5-alpine
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: redis-data
          mountPath: /data
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - 'yes'
        - --dir
        - /data
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
      volumes:
      - name: tmp
        emptyDir: {}
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
  strategy:
    type: Recreate
