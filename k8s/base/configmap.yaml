apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  RETRIEVER: stub
  LLM_PROVIDER: stub
  EMBED_MODEL: dummy-768
  LLM_MODEL: llama3.2:3b
  CHROMA_HOST: chroma
  CHROMA_PORT: '8000'
  CHROMA_COLLECTION: rahbar
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  TOP_K: '5'
  CHUNK_SIZE: '400'
  CHUNK_OVERLAP: '50'
  RELEVANCE_FLOOR: '0.45'
