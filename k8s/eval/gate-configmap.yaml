# Release gate thresholds read by the eval Job as /config/gate.yaml (Part C2, F2).
# Keep the values equal to eval/gate.yaml. Changing them here changes the outcome of
# the next eval Job without rebuilding the image:
#   kubectl -n rahbar edit configmap rahbar-gate
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-gate
  namespace: rahbar
data:
  gate.yaml: |
    # Release gate thresholds (Part C2). The cluster reads the same keys from the
    # rahbar-gate ConfigMap (k8s/eval/gate-configmap.yaml); keep both equal.
    # A null value fails the gate on purpose: set it from the baseline run and write the
    # reason in the report.
    max_recall5_drop: 0.02          # recall@5 may fall at most 2 points below the baseline
    min_faithfulness: 0.33           # baseline 0.3333 = 5 of 15 judged answers; one answer is 6.7 points, so no answer may be lost
    max_p95_latency_seconds: 9.1   # 1.5 x baseline p95 of 6.07 s on this laptop
    abstention_not_below_baseline: true
    min_citation_validity: 0.95     # Assignment 2's gate value
